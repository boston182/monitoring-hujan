<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisis Kandang Elba & KUB Janaka</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f4f7f6; color: #333; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: #fff; border-radius: 16px; padding: 25px; width: 100%; max-width: 420px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; margin-bottom: 5px; color: #2c3e50; font-size: 1.3rem; }
        .subtitle { text-align: center; font-size: 0.85rem; color: #666; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; }
        input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 1rem; }
        button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #27ae60; color: white; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; }
        button:hover { background: #219653; }
        .btn-danger { background: #e74c3c; margin-top: 8px; font-size: 0.85rem; padding: 8px; }
        .btn-danger:hover { background: #c0392b; }
        .result-card { margin-top: 20px; padding: 15px; border-radius: 10px; background: #f8f9fa; border-left: 5px solid #ccc; }
        .status-aman { border-color: #27ae60; background: #e8f8f5; color: #1e8449; }
        .status-waspada { border-color: #f39c12; background: #fef9e7; color: #b7950b; }
        .status-bahaya { border-color: #c0392b; background: #f9ebea; color: #922b21; }
        .status-title { font-weight: bold; font-size: 1.1rem; margin-bottom: 5px; }
        .advice { font-size: 0.88rem; margin-top: 8px; line-height: 1.4; }
        
        /* Style untuk Riwayat */
        .history-section { margin-top: 25px; border-top: 1px solid #eee; padding-top: 15px; }
        .history-title { font-weight: bold; font-size: 1rem; margin-bottom: 10px; color: #2c3e50; }
        .history-list { max-height: 200px; overflow-y: auto; font-size: 0.85rem; }
        .history-item { background: #fdfefe; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; margin-bottom: 8px; }
        .history-time { color: #7f8c8d; font-size: 0.75rem; margin-bottom: 3px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Analisis Kandang Ayam</h2>
        <div class="subtitle">Khusus: Ayam Elba & KUB 2 Janaka</div>
        
        <div class="input-group">
            <label>Suhu Kandang (°C):</label>
            <input type="number" id="inputSuhu" placeholder="Contoh: 26" step="0.1">
        </div>

        <div class="input-group">
            <label>Kelembapan Kandang (%):</label>
            <input type="number" id="inputKelembapan" placeholder="Contoh: 65" step="1">
        </div>

        <button onclick="analisisKandang()">Analisis & Simpan Catatan</button>

        <div class="result-card" id="resultCard" style="display: none;">
            <div class="status-title" id="statusTitle">--</div>
            <p>Suhu: <span id="resSuhu">--</span> | Kelembapan: <span id="resKelembapan">--</span></p>
            <div class="advice" id="adviceText">--</div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 Riwayat Catatan Harian</div>
            <div class="history-list" id="historyList">
                <p style="color: #888; font-style: italic;">Belum ada catatan tersimpan.</p>
            </div>
            <button class="btn-danger" onclick="hapusRiwayat()" id="btnClear" style="display: none;">Hapus Riwayat</button>
        </div>
    </div>

    <script>
        // Memuat riwayat tersimpan saat halaman dibuka
        window.onload = function() {
            tampilkanRiwayat();
        };

        function analisisKandang() {
            const suhu = parseFloat(document.getElementById('inputSuhu').value);
            const kelembapan = parseFloat(document.getElementById('inputKelembapan').value);
            const card = document.getElementById('resultCard');
            const statusTitle = document.getElementById('statusTitle');
            const resSuhu = document.getElementById('resSuhu');
            const resKelembapan = document.getElementById('resKelembapan');
            const adviceText = document.getElementById('adviceText');

            if (isNaN(suhu) || isNaN(kelembapan)) {
                alert('Masukkan angka suhu dan kelembapan dengan benar!');
                return;
            }

            card.style.display = 'block';
            resSuhu.innerText = suhu + '°C';
            resKelembapan.innerText = kelembapan + '%';

            let statusStr = '';
            let adviceStr = '';
            let statusClass = '';

            // Logika Standar Kenyamanan Ayam Elba & KUB Janaka
            if (suhu >= 22 && suhu <= 26 && kelembapan >= 55 && kelembapan <= 70) {
                statusClass = 'status-aman';
                statusStr = '✅ KONDISI IDEAL & AMAN';
                adviceStr = 'Suhu dan kelembapan sangat nyaman. Produktivitas telur dan nafsu makan optimal.';
            } 
            else if ((suhu > 26 && suhu <= 30) || (suhu >= 20 && suhu < 22)) {
                statusClass = 'status-waspada';
                statusStr = '⚠️ WASPADA (Perubahan Mulai Terasa)';
                adviceStr = 'Suhu/kelembapan bergeser. Pantau sirkulasi udara agar ayam tidak stres ringan.';
            } 
            else if (suhu > 30 || (suhu > 28 && kelembapan > 75)) {
                statusClass = 'status-bahaya';
                statusStr = '🚨 BAHAYA: RISIKO HEAT STRESS!';
                adviceStr = 'Suhu/lembab tinggi! Risiko turun produksi & cangkang tipis. Buka tirai / nyalakan kipas.';
            } 
            else if (suhu < 20) {
                statusClass = 'status-waspada';
                statusStr = '❄️ SUHU TERLALU DINGIN';
                adviceStr = 'Suhu rendah, energi ayam banyak terbuang untuk menghangatkan badan. Pertimbangkan merapatkan tirai.';
            } 
            else {
                statusClass = 'status-waspada';
                statusStr = '⚠️ KELEMBAPAN TIDAK IDEAL';
                adviceStr = 'Kelembapan di luar batas normal. Waspadai potensi amonia jika litter basah.';
            }

            card.className = 'result-card ' + statusClass;
            statusTitle.innerText = statusStr;
            adviceText.innerText = adviceStr;

            // Simpan ke LocalStorage HP
            simpanKeRiwayat(suhu, kelembapan, statusStr);
        }

        function simpanKeRiwayat(suhu, kelembapan, status) {
            const sekarang = new Date();
            const waktuString = sekarang.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) + ' - ' + sekarang.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

            const dataBaru = {
                waktu: waktuString,
                suhu: suhu,
                kelembapan: kelembapan,
                status: status
            };

            let riwayat = JSON.parse(localStorage.getItem('riwayatKandang')) || [];
            riwayat.unshift(dataBaru); // Masukkan data terbaru ke urutan paling atas

            // Batasi maksimal 50 riwayat terakhir agar memori HP tidak penuh
            if (riwayat.length > 50) {
                riwayat.pop();
            }

            localStorage.setItem('riwayatKandang', JSON.stringify(riwayat));
            tampilkanRiwayat();
        }

        function tampilkanRiwayat() {
            const historyList = document.getElementById('historyList');
            const btnClear = document.getElementById('btnClear');
            let riwayat = JSON.parse(localStorage.getItem('riwayatKandang')) || [];

            if (riwayat.length === 0) {
                historyList.innerHTML = '<p style="color: #888; font-style: italic;">Belum ada catatan tersimpan.</p>';
                btnClear.style.display = 'none';
                return;
            }

            btnClear.style.display = 'block';
            let html = '';
            riwayat.forEach(item => {
                html += `
                    <div class="history-item">
                        <div class="history-time">📅 ${item.waktu}</div>
                        <strong>Suhu: ${item.suhu}°C | Kelembapan: ${item.kelembapan}%</strong>
                        <div style="font-size: 0.8rem; margin-top: 2px; font-weight: bold;">${item.status}</div>
                    </div>
                `;
            });
            historyList.innerHTML = html;
        }

        function hapusRiwayat() {
            if (confirm('Yakin ingin menghapus seluruh riwayat catatan kandang?')) {
                localStorage.removeItem('riwayatKandang');
                tampilkanRiwayat();
            }
        }
    </script>
</body>
</html>
