<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Monitoring Hujan Real-Time</title>
    <!-- PWA Manifest & Warna Tema HP -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e3c72">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            text-align: center;
        }
        h2 {
            margin-bottom: 10px;
            font-size: 1.5rem;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        input {
            flex: 1;
            padding: 10px 15px;
            border-radius: 8px;
            border: none;
            outline: none;
            font-size: 1rem;
        }
        button {
            padding: 10px 15px;
            border-radius: 8px;
            border: none;
            background: #ff7b00;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #e06d00;
        }
        .weather-card {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin-top: 15px;
        }
        .status-hujan {
            font-size: 1.4rem;
            font-weight: bold;
            margin: 15px 0;
            padding: 10px;
            border-radius: 8px;
        }
        .terang { background: rgba(46, 204, 113, 0.3); color: #2ecc71; }
        .hujan { background: rgba(52, 152, 219, 0.3); color: #3498db; }
        .details {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Monitoring Cuaca & Hujan</h2>
        
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Masukkan nama kota..." value="Jakarta">
            <button onclick="getWeatherData()">Cek</button>
        </div>

        <div class="weather-card" id="weatherCard">
            <h3 id="cityName">Memuat...</h3>
            <div id="rainStatus" class="status-hujan">---</div>
            <p id="weatherDesc">Deskripsi cuaca</p>
            
            <div class="details">
                <div>
                    <p>Suhu</p>
                    <strong id="temp">--°C</strong>
                </div>
                <div>
                    <p>Kelembapan</p>
                    <strong id="humidity">--%</strong>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
