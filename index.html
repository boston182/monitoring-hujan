<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisis Kandang & Cuaca Elba & KUB Janaka</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f4f7f6; color: #333; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: #fff; border-radius: 16px; padding: 25px; width: 100%; max-width: 420px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; margin-bottom: 5px; color: #2c3e50; font-size: 1.3rem; }
        .subtitle { text-align: center; font-size: 0.85rem; color: #666; margin-bottom: 20px; }
        .input-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 0.85rem; color: #444; }
        input, select { width: 100%; padding: 9px; border-radius: 8px; border: 1px solid #ccc; font-size: 0.95rem; background: #fff; }
        .row { display: flex; gap: 10px; }
        .col { flex: 1; }
        button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #27ae60; color: white; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; }
        button:hover { background: #219653; }
        .btn-danger { background: #e74c3c; margin-top: 8px; font-size: 0.85rem; padding: 8px; }
        .btn-danger:hover { background: #c0392b; }
        .result-card { margin-top: 20px; padding: 15px; border-radius: 10px; background: #f8f9fa; border-left: 5px solid #ccc; }
        .status-aman { border-color: #27ae60; background: #e8f8f5; color: #1e8449; }
        .status-waspada { border-color: #f39c12; background: #fef9e7; color: #b7950b; }
        .status-bahaya { border-color: #c0392b; background: #f9ebea; color: #922b21; }
        .status-title { font-weight: bold; font-size: 1.05rem; margin-bottom: 5px; }
        .advice { font-size: 0.85rem; margin-top: 6px; line-height: 1.4; }
        
        .history-section { margin-top: 25px; border-top: 1px solid #eee; padding-top: 15px; }
        .history-title { font-weight: bold; font-size: 1rem; margin-bottom: 10px; color: #2c3e50; }
        .history-list { max-height: 220px; overflow-y: auto; font-size: 0.85rem; }
        .history-item { background: #fdfefe; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; margin-bottom: 8px; }
        .history-time { color: #7f8c8d; font-size: 0.75rem; margin-bottom: 3px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Analisis Kandang & Cuaca</h2>
        <div class="subtitle">Khusus: Ayam Elba & KUB 2 Janaka</div>
        
        <div class="row">
            <div class="input-group col">
                <label>Suhu (°C):</label>
                <input type="number" id="inputSuhu" placeholder="Mis: 26" step="0.1">
            </div>
            <div class="input-group col">
                <label>Kelembapan (%):</label>
                <input type="number" id="inputKelembapan" placeholder="Mis: 65" step="1">
            </div>
        </div>

        <div class="row">
            <div class="input-group col">
                <label>Intensitas Hujan:</label>
                <select id="inputHujan">
                    <option value="Tidak Hujan">Tidak Hujan / Cerah</option>
                    <option value="Hujan Ringan">Ringan</option>
                    <option value="Hujan Sedang">Sedang</option>
                    <option value="Hujan Tinggi/Lebat">Tinggi (Lebat)</option>
                </select>
            </div>
            <div class="input-group col">
                <label>Kondisi Angin:</label>
                <select id="inputAngin">
                    <option value="Tanpa Angin">Tanpa Angin</option>
                    <option value="Angin Semilir">Semilir (Normal)</option>
                    <option value="Angin Kencang">Kencang</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="input-group col">
                <label>Jam Hujan:</label>
                <input type="text" id="inputJam" placeholder="Mis: 14:30">
            </div>
            <div class="input-group col">
                <label>Durasi Hujan:</label>
                <input type="text" id="inputDurasi" placeholder="Mis: 2 Jam">
            </div>
        </div>

        <button onclick="analisisKandang()">Analisis & Simpan Catatan</button>

        <div class="result-card" id="resultCard" style="display: none;">
            <div class="status-title" id="statusTitle">--</div>
            <p id="resDetailUmum" style="font-size: 0.85rem; font-weight: bold; margin-bottom: 4px;"></p>
            <p id="resDetailCuaca" style="font-size: 0.8rem; color: #555;"></p>
            <div class="advice" id="adviceText">--</div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 Riwayat Catatan Kandang & Cuaca</div>
            <div class="history-list" id="historyList">
                <p style="color: #888; font-style: italic;">Belum ada catatan tersimpan.</p>
            </div>
            <button class="btn-danger" onclick="hapusRiwayat()" id="btnClear" style="display: none;">Hapus Riwayat</button>
        </div>
    </div>

    <script>
        window.onload = function() {
            tampilkanRiwayat();
            // Otomatis isi jam saat ini sebagai referensi
            const d = new Date();
            document.getElementById('inputJam').value = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        };

        function analisisKandang() {
            const suhu = parseFloat(document.getElementById('inputSuhu').value);
            const kelembapan = parseFloat(document.getElementById('inputKelembapan').value);
            const hujan = document.getElementById('inputHujan').value;
            const angin = document.getElementById('inputAngin').value;
            const jam = document.getElementById('inputJam').value || '-';
            const durasi = document.getElementById('inputDurasi').value || '-';

            const card = document.getElementById('resultCard');
            const statusTitle = document.getElementById('statusTitle');
            const resDetailUmum = document.getElementById('resDetailUmum');
            const resDetailCuaca = document.getElementById('resDetailCuaca');
            const adviceText = document.getElementById('adviceText');

            if (isNaN(suhu) || isNaN(kelembapan)) {
                alert('Masukkan angka suhu dan kelembapan dengan benar!');
                return;
            }

            card.style.display = 'block';
            resDetailUmum.innerText = `Suhu: ${suhu}°C | Kelembapan: ${kelembapan}%`;
            resDetailCuaca.innerText = `Cuaca: ${hujan} (${angin}) | Jam: ${jam} | Durasi: ${durasi}`;

            let statusStr = '';
            let adviceStr = '';
            let statusClass = '';

            // Analisis berdasarkan suhu, kelembapan, serta pengaruh cuaca luar (hujan & angin)
            if (suhu >= 22 && suhu <= 26 && kelembapan >= 55 && kelembapan <= 70) {
                statusClass = 'status-aman';
                statusStr = '✅ KONDISI IDEAL & AMAN';
                adviceStr = 'Suhu & kelembapan nyaman untuk Elba & KUB Janaka.';
            } else if (suhu > 30 || (suhu > 28 && kelembapan > 75)) {
                statusClass = 'status-bahaya';
                statusStr = '🚨 BAHAYA: RISIKO HEAT STRESS!';
                adviceStr = 'Suhu/lembab tinggi! Potensi turun produksi telur. Perkuat sirkulasi udara.';
            } else {
                statusClass = 'status-waspada';
                statusStr = '⚠️ KONDISI PERLU PERHATIAN';
                adviceStr = 'Suhu/kelembapan agak bergeser dari standar ideal.';
            }

            // Tambahan analisis khusus jika hujan atau angin kencang
            if (hujan !== 'Tidak Hujan') {
                adviceStr += ` [Info Hujan: ${hujan}, Pukul ${jam}, Durasi ${durasi}]. Waspada kenaikan kelembapan kandang & risiko amonia sekam basah.`;
                if (angin === 'Angin Kencang') {
                    adviceStr += ' Perhatian: Angin kencang saat hujan, pastikan tirai sisi arah angin ditutup sebagian agar ayam tidak masuk angin/kedinginan.';
                }
            } else if (angin === 'Angin Kencang') {
                adviceStr += ' Perhatian: Angin kencang dapat menurunkan suhu efektif kandang secara drastis.';
            }

            card.className = 'result-card ' + statusClass;
            statusTitle.innerText = statusStr;
            adviceText.innerText = adviceStr;

            simpanKeRiwayat(suhu, kelembapan, hujan, angin, jam, durasi, statusStr);
        }

        function simpanKeRiwayat(suhu, kelembapan, hujan, angin, jam, durasi, status) {
            const sekarang = new Date();
            const waktuCatat = sekarang.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });

            const dataBaru = {
                tanggal: waktuCatat,
                suhu, kelembapan, hujan, angin, jam, durasi, status
            };

            let riwayat = JSON.parse(localStorage.getItem('riwayatKandangCuaca')) || [];
            riwayat.unshift(dataBaru);
            if (riwayat.length > 50) riwayat.pop();

            localStorage.setItem('riwayatKandangCuaca', JSON.stringify(riwayat));
            tampilkanRiwayat();
        }

        function tampilkanRiwayat() {
            const historyList = document.getElementById('historyList');
            const btnClear = document.getElementById('btnClear');
            let riwayat = JSON.parse(localStorage.getItem('riwayatKandangCuaca')) || [];

            if (riwayat.length === 0) {
                historyList.innerHTML = '<p style="color: #888; font-style: italic;">Belum ada catatan tersimpan.</p>';
                btnClear.style.display = 'none';
                return;
            }

            btnClear.style.display = 'block';
            let html = '';
            riwayat.forEach(item => {
                html += `
                    <div class="history-item">
                        <div class="history-time">📅 Input: ${item.tanggal}</div>
                        <strong>${item.suhu}°C | Lembap: ${item.kelembapan}% | ${item.hujan}</strong>
                        <div style="font-size: 0.8rem; color: #444; margin-top: 2px;">
                            🌬️ Angin: ${item.angin} | ⏰ Jam: ${item.jam} | ⏳ Durasi: ${item.durasi}
                        </div>
                        <div style="font-size: 0.78rem; margin-top: 3px; font-weight: bold;">${item.status}</div>
                    </div>
                `;
            });
            historyList.innerHTML = html;
        }

        function hapusRiwayat() {
            if (confirm('Yakin ingin menghapus seluruh riwayat catatan kandang?')) {
                localStorage.removeItem('riwayatKandangCuaca');
                tampilkanRiwayat();
            }
        }
    </script>
</body>
</html>
