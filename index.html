<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Kandang - Elba & KUB Janaka</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 15px; }
        .container { background: #1e293b; border-radius: 20px; padding: 24px; width: 100%; max-width: 450px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); border: 1px solid #334155; }
        
        h2 { text-align: center; color: #f8fafc; font-size: 1.35rem; font-weight: 700; margin-bottom: 4px; }
        .subtitle { text-align: center; font-size: 0.82rem; color: #94a3b8; margin-bottom: 15px; background: #334155; padding: 4px 10px; border-radius: 20px; display: inline-block; width: 100%; }
        
        .section-title { font-size: 0.88rem; color: #38bdf8; font-weight: 600; margin: 14px 0 6px 0; border-left: 3px solid #38bdf8; padding-left: 8px; }
        
        .input-group { margin-bottom: 10px; }
        label { display: block; margin-bottom: 3px; font-weight: 500; font-size: 0.8rem; color: #cbd5e1; }
        input, select { width: 100%; padding: 9px; border-radius: 9px; border: 1px solid #475569; font-size: 0.9rem; background: #0f172a; color: #f8fafc; outline: none; }
        input:focus, select:focus { border-color: #38bdf8; }
        
        .row { display: flex; gap: 8px; }
        .col { flex: 1; }
        
        button { width: 100%; padding: 12px; border-radius: 10px; border: none; background: #10b981; color: white; font-weight: 600; font-size: 0.95rem; cursor: pointer; margin-top: 14px; transition: background 0.2s; }
        button:hover { background: #059669; }
        
        .btn-excel { background: #2563eb; margin-top: 8px; font-size: 0.85rem; padding: 9px; }
        .btn-excel:hover { background: #1d4ed8; }
        
        .btn-danger { background: #ef4444; margin-top: 6px; font-size: 0.8rem; padding: 7px; }
        .btn-danger:hover { background: #dc2626; }
        
        .result-card { margin-top: 15px; padding: 14px; border-radius: 12px; background: #0f172a; border-left: 5px solid #ccc; }
        .status-aman { border-color: #10b981; color: #34d399; }
        .status-waspada { border-color: #f59e0b; color: #fbbf24; }
        .status-bahaya { border-color: #ef4444; color: #f87171; }
        .status-title { font-weight: 700; font-size: 1.05rem; margin-bottom: 4px; }
        .advice { font-size: 0.82rem; margin-top: 6px; line-height: 1.35; color: #cbd5e1; }
        
        .reminder-box { background: #312e81; border: 1px solid #4338ca; border-radius: 10px; padding: 10px; margin-top: 12px; font-size: 0.82rem; color: #e0e7ff; }
        .reminder-title { font-weight: 700; color: #818cf8; margin-bottom: 2px; }

        .history-section { margin-top: 20px; border-top: 1px solid #334155; padding-top: 12px; }
        .history-title { font-weight: 600; font-size: 0.9rem; margin-bottom: 8px; color: #f8fafc; }
        .history-list { max-height: 180px; overflow-y: auto; font-size: 0.8rem; padding-right: 4px; }
        .history-item { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 9px; margin-bottom: 6px; }
        .history-time { color: #94a3b8; font-size: 0.72rem; margin-bottom: 2px; }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Smart Kandang</h2>
        <div class="subtitle">Elba & KUB Janaka (Target 1 Kg)</div>
        
        <div class="section-title">🐔 Data Asas & Populasi</div>
        <div class="row">
            <div class="input-group col">
                <label>Tanggal Check-in DOC:</label>
                <input type="date" id="inputCheckIn">
            </div>
            <div class="input-group col">
                <label>Jumlah Populasi (Ekor):</label>
                <input type="number" id="inputPopulasi" value="79">
            </div>
        </div>

        <div class="section-title">📊 1. Data Pakan Harian</div>
        <div class="input-group">
            <label>Pakan Habis Hari Ini (Kg/Gram):</label>
            <input type="text" id="inputPakan" placeholder="Mis: 350 gram">
        </div>

        <div class="section-title">🌡️ 2. Monitoring Cuaca & Kandang</div>
        <div class="row">
            <div class="input-group col">
                <label>Suhu Kandang (°C):</label>
                <input type="number" id="inputSuhu" placeholder="Mis: 28" step="0.1">
            </div>
            <div class="input-group col">
                <label>Kelembapan (%):</label>
                <input type="number" id="inputKelembapan" placeholder="Mis: 60">
            </div>
        </div>

        <div class="row">
            <div class="input-group col">
                <label>Kondisi Hujan:</label>
                <select id="inputHujan">
                    <option value="Tidak Hujan">Tidak Hujan / Cerah</option>
                    <option value="Hujan Ringan">Hujan Ringan</option>
                    <option value="Hujan Sedang">Hujan Sedang</option>
                    <option value="Hujan Lebat">Hujan Lebat</option>
                </select>
            </div>
            <div class="input-group col">
                <label>Kondisi Litter (Sekam):</label>
                <select id="inputSekam">
                    <option value="Kering & Gembur">Kering & Gembur (Aman)</option>
                    <option value="Lembap">Mulai Lembap</option>
                    <option value="Basah / Menggumpal">Basah / Menggumpal ⚠️</option>
                </select>
            </div>
        </div>

        <button onclick="analisisDanSimpan()">Proses Analisis & Catat</button>

        <div class="result-card" id="resultCard" style="display: none;">
            <div class="status-title" id="statusTitle">--</div>
            <p id="resRingkasan" style="font-size: 0.82rem; font-weight: 600; color: #f8fafc; margin-bottom: 3px;"></p>
            <div class="advice" id="adviceText">--</div>
            <div class="reminder-box" id="reminderBox">
                <div class="reminder-title">🔔 Pengingat Pemeliharaan:</div>
                <div id="reminderText">-</div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 Riwayat Catatan Harian</div>
            <div class="history-list" id="historyList">
                <p style="color: #64748b; font-style: italic;">Belum ada catatan tersimpan.</p>
            </div>
            <button class="btn-excel" onclick="downloadExcel()" id="btnExcel" style="display: none;">📥 Unduh Laporan (Excel / CSV)</button>
            <button class="btn-danger" onclick="hapusRiwayat()" id="btnClear" style="display: none;">Hapus Riwayat</button>
        </div>
    </div>

    <script>
        window.onload = function() {
            tampilkanRiwayat();
            if(!localStorage.getItem('savedCheckIn')) {
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('inputCheckIn').value = today;
                localStorage.setItem('savedCheckIn', today);
            } else {
                document.getElementById('inputCheckIn').value = localStorage.getItem('savedCheckIn');
            }
            if(localStorage.getItem('savedPopulasi')) {
                document.getElementById('inputPopulasi').value = localStorage.getItem('savedPopulasi');
            }
        };

        function hitungUmurAyam(checkInDate) {
            const tglCheckIn = new Date(checkInDate);
            const tglHariIni = new Date();
            const selisihWaktu = tglHariIni - tglCheckIn;
            const selisihHari = Math.floor(selisihWaktu / (1000 * 60 * 60 * 24)) + 1;
            return selisihHari > 0 ? selisihHari : 1;
        }

        function analisisDanSimpan() {
            const checkIn = document.getElementById('inputCheckIn').value;
            const populasi = document.getElementById('inputPopulasi').value;
            const pakan = document.getElementById('inputPakan').value || '-';
            const suhu = parseFloat(document.getElementById('inputSuhu').value);
            const kelembapan = parseFloat(document.getElementById('inputKelembapan').value);
            const hujan = document.getElementById('inputHujan').value;
            const sekam = document.getElementById('inputSekam').value;

            if(!checkIn) {
                alert('Silakan masukkan tanggal check-in DOC!');
                return;
            }

            localStorage.setItem('savedCheckIn', checkIn);
            localStorage.setItem('savedPopulasi', populasi);

            const umur = hitungUmurAyam(checkIn);

            const card = document.getElementById('resultCard');
            const statusTitle = document.getElementById('statusTitle');
            const resRingkasan = document.getElementById('resRingkasan');
            const adviceText = document.getElementById('adviceText');
            const reminderText = document.getElementById('reminderText');

            if (isNaN(suhu) || isNaN(kelembapan)) {
                alert('Mohon isi Suhu dan Kelembapan dengan benar!');
                return;
            }

            card.style.display = 'block';
            resRingkasan.innerText = `Umur: Hari ke-${umur} | Populasi: ${populasi} Ekor | Pakan: ${pakan}`;

            let statusStr = '';
            let adviceStr = '';
            let statusClass = '';

            if (suhu >= 22 && suhu <= 26 && kelembapan >= 55 && kelembapan <= 70 && sekam === 'Kering & Gembur') {
                statusClass = 'status-aman';
                statusStr = '✅ KONDISI KANDANG IDEAL';
                adviceStr = 'Pertumbuhan menuju bobot 1 kg berjalan optimal dengan dukungan pakan & maggot.';
            } else if (suhu > 30 || kelembapan > 80 || sekam === 'Basah / Menggumpal') {
                statusClass = 'status-bahaya';
                statusStr = '🚨 PERINGATAN RISIKO LINGKUNGAN';
                adviceStr = 'Kelembapan/suhu tinggi. Waspada peningkatan gas amonia dari sisa kandang & baki maggot.';
            } else {
                statusClass = 'status-waspada';
                statusStr = '⚠️ PERHATIAN KONDISI KANDANG';
                adviceStr = 'Parameter sedikit bergeser dari tahap nyaman. Silakan pantau sirkulasi udara.';
            }

            let reminderStr = '• Pastikan penggiliran baki maggot di bawah kandang terkawal.<br>';
            if (sekam === 'Basah / Menggumpal' || kelembapan > 75) {
                reminderStr += '👉 <strong>SEGERA GANTI LITTER / TAMBAH SEKAM BAKAR!</strong> Alas kandang terlalu lembap.<br>';
            }
            if (umur <= 14) {
                reminderStr += '👉 Fase Starter: Pastikan pemanas stabil dan air minum cukup untuk 79 ekor anak ayam.';
            } else if (umur > 14 && umur <= 35) {
                reminderStr += '👉 Fase Grower: Optimalkan pemberian pakan & maggot untuk mengejar target bobot 1 kg.';
            } else {
                reminderStr += '👉 Fase Pembesaran Akhir: Periksa keseragaman ukuran dan kualitas baki maggot.';
            }

            card.className = 'result-card ' + statusClass;
            statusTitle.innerText = statusStr;
            adviceText.innerText = adviceStr;
            reminderText.innerHTML = reminderStr;

            simpanKeRiwayat(umur, populasi, pakan, suhu, kelembapan, hujan, sekam, statusStr);
        }

        function simpanKeRiwayat(umur, populasi, pakan, suhu, kelembapan, hujan, sekam, status) {
            const sekarang = new Date();
            const waktuCatat = sekarang.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) + ' ' + sekarang.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

            const dataBaru = { waktuCatat, umur, populasi, pakan, suhu, kelembapan, hujan, sekam, status };

            let riwayat = JSON.parse(localStorage.getItem('riwayatSmartKandangFinalV4')) || [];
            riwayat.unshift(dataBaru);
            if (riwayat.length > 100) riwayat.pop();

            localStorage.setItem('riwayatSmartKandangFinalV4', JSON.stringify(riwayat));
            tampilkanRiwayat();
        }

        function tampilkanRiwayat() {
            const historyList = document.getElementById('historyList');
            const btnClear = document.getElementById('btnClear');
            const btnExcel = document.getElementById('btnExcel');
            let riwayat = JSON.parse(localStorage.getItem('riwayatSmartKandangFinalV4')) || [];

            if (riwayat.length === 0) {
                historyList.innerHTML = '<p style="color: #64748b; font-style: italic;">Belum ada catatan tersimpan.</p>';
                btnClear.style.display = 'none';
                btnExcel.style.display = 'none';
                return;
            }

            btnClear.style.display = 'block';
            btnExcel.style.display = 'block';
            let html = '';
            riwayat.forEach(item => {
                html += `
                    <div class="history-item">
                        <div class="history-time">📅 ${item.waktuCatat} (Hari ke-${item.umur} | ${item.populasi} Ekor)</div>
                        <strong>Pakan: ${item.pakan} | Suhu: ${item.suhu}°C | Lembap: ${item.kelembapan}%</strong>
                        <div style="color: #94a3b8; margin-top: 2px;">
                            🌧️ ${item.hujan} | 🪵 Sekam: ${item.sekam}
                        </div>
                    </div>
                `;
            });
            historyList.innerHTML = html;
        }

        function downloadExcel() {
            let riwayat = JSON.parse(localStorage.getItem('riwayatSmartKandangFinalV4')) || [];
            if (riwayat.length === 0) {
                alert('Belum ada data untuk diunduh.');
                return;
            }

            // Format CSV yang bisa dibuka langsung di Microsoft Excel
            let csvContent = "Waktu Catat;Umur (Hari);Populasi (Ekor);Pakan Habis;Suhu (C);Kelembapan (%);Kondisi Hujan;Kondisi Sekam;Status Kandang\n";
            
            riwayat.forEach(item => {
                csvContent += `"${item.waktuCatat}";"${item.umur}";"${item.populasi}";"${item.pakan}";"${item.suhu}";"${item.kelembapan}";"${item.hujan}";"${item.sekam}";"${item.status}"\n`;
            });

            const blob = new Blob(["\ufeff" + csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Laporan_Smart_Kandang_Elba_KUB.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function hapusRiwayat() {
            if (confirm('Yakin ingin menghapus seluruh riwayat catatan kandang?')) {
                localStorage.removeItem('riwayatSmartKandangFinalV4');
                tampilkanRiwayat();
            }
        }
    </script>
</body>
</html>
