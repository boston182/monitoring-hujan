<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Kandang - Elba & KUB Janaka</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 15px; }
        .container { background: #1e293b; border-radius: 20px; padding: 24px; width: 100%; max-width: 450px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3); border: 1px solid #334155; }
        
        h2 { text-align: center; color: #f8fafc; font-size: 1.4rem; font-weight: 700; margin-bottom: 4px; }
        .subtitle { text-align: center; font-size: 0.85rem; color: #94a3b8; margin-bottom: 20px; background: #334155; padding: 4px 10px; border-radius: 20px; display: inline-block; width: 100%; }
        
        .section-title { font-size: 0.9rem; color: #38bdf8; font-weight: 600; margin: 15px 0 8px 0; border-left: 3px solid #38bdf8; padding-left: 8px; }
        
        .input-group { margin-bottom: 10px; }
        label { display: block; margin-bottom: 4px; font-weight: 500; font-size: 0.82rem; color: #cbd5e1; }
        input, select { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #475569; font-size: 0.95rem; background: #0f172a; color: #f8fafc; outline: none; transition: border-color 0.2s; }
        input:focus, select:focus { border-color: #38bdf8; }
        
        .row { display: flex; gap: 10px; }
        .col { flex: 1; }
        
        button { width: 100%; padding: 12px; border-radius: 12px; border: none; background: #10b981; color: white; font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 15px; transition: background 0.2s, transform 0.1s; }
        button:hover { background: #059669; }
        button:active { transform: scale(0.98); }
        
        .btn-danger { background: #ef4444; margin-top: 10px; font-size: 0.85rem; padding: 8px; }
        .btn-danger:hover { background: #dc2626; }
        
        .result-card { margin-top: 20px; padding: 16px; border-radius: 14px; background: #0f172a; border-left: 6px solid #ccc; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); }
        .status-aman { border-color: #10b981; color: #34d399; }
        .status-waspada { border-color: #f59e0b; color: #fbbf24; }
        .status-bahaya { border-color: #ef4444; color: #f87171; }
        .status-title { font-weight: 700; font-size: 1.1rem; margin-bottom: 6px; }
        .advice { font-size: 0.85rem; margin-top: 8px; line-height: 1.4; color: #cbd5e1; }
        
        .history-section { margin-top: 25px; border-top: 1px solid #334155; padding-top: 15px; }
        .history-title { font-weight: 600; font-size: 0.95rem; margin-bottom: 10px; color: #f8fafc; }
        .history-list { max-height: 200px; overflow-y: auto; font-size: 0.82rem; padding-right: 4px; }
        .history-item { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 10px; margin-bottom: 8px; }
        .history-time { color: #94a3b8; font-size: 0.73rem; margin-bottom: 3px; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Smart Kandang</h2>
        <div class="subtitle">Ayam Elba & KUB 2 Janaka</div>
        
        <div class="section-title">🌡️ Parameter Mikro-Kandang</div>
        <div class="row">
            <div class="input-group col">
                <label>Suhu (°C):</label>
                <input type="number" id="inputSuhu" placeholder="Mis: 26" step="0.1">
            </div>
            <div class="input-group col">
                <label>Kelembapan (%):</label>
                <input type="number" id="inputKelembapan" placeholder="Mis: 65" step="1">
            </div>
        </div>

        <div class="row">
            <div class="input-group col">
                <label>Kondisi Sekam (Litter):</label>
                <select id="inputSekam">
                    <option value="Kering & Gembur">Kering & Gembur (Ideal)</option>
                    <option value="Agak Lembap">Agak Lembap</option>
                    <option value="Basah / Menggumpal">Basah / Menggumpal ⚠️</option>
                </select>
            </div>
            <div class="input-group col">
                <label>Posisi Tirai:</label>
                <select id="inputTirai">
                    <option value="Terbuka Penuh">Terbuka Penuh</option>
                    <option value="Ditutup Sebagian">Ditutup Sebagian</option>
                    <option value="Tertutup Rapat">Tertutup Rapat</option>
                </select>
            </div>
        </div>

        <div class="section-title">🌦️ Catatan Cuaca & Perilaku</div>
        <div class="row">
            <div class="input-group col">
                <label>Intensitas Hujan:</label>
                <select id="inputHujan">
                    <option value="Tidak Hujan">Tidak Hujan</option>
                    <option value="Hujan Ringan">Ringan</option>
                    <option value="Hujan Sedang">Sedang</option>
                    <option value="Hujan Tinggi/Lebat">Lebat (Tinggi)</option>
                </select>
            </div>
            <div class="input-group col">
                <label>Kondisi Angin:</label>
                <select id="inputAngin">
                    <option value="Tanpa Angin">Tanpa Angin</option>
                    <option value="Semilir">Semilir Normal</option>
                    <option value="Angin Kencang">Kencang 💨</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="input-group col">
                <label>Jam & Durasi Hujan:</label>
                <input type="text" id="inputWaktuHujan" placeholder="Mis: 14:00 (2 Jam)">
            </div>
            <div class="input-group col">
                <label>Nafsu Makan Ayam:</label>
                <select id="inputNafsuMakan">
                    <option value="Normal Lahap">Normal & Lahap</option>
                    <option value="Agak Menurun">Agak Menurun</option>
                    <option value="Turun Drastis">Turun Drastis ⚠️</option>
                </select>
            </div>
        </div>

        <button onclick="analisisKandang()">Analisis & Simpan Catatan</button>

        <div class="result-card" id="resultCard" style="display: none;">
            <div class="status-title" id="statusTitle">--</div>
            <p id="resRingkasan" style="font-size: 0.83rem; font-weight: 600; color: #f8fafc; margin-bottom: 4px;"></p>
            <div class="advice" id="adviceText">--</div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 Riwayat Catatan Harian</div>
            <div class="history-list" id="historyList">
                <p style="color: #64748b; font-style: italic;">Belum ada catatan tersimpan.</p>
            </div>
            <button class="btn-danger" onclick="hapusRiwayat()" id="btnClear" style="display: none;">Hapus Riwayat</button>
        </div>
    </div>

    <script>
        window.onload = function() {
            tampilkanRiwayat();
        };

        function analisisKandang() {
            const suhu = parseFloat(document.getElementById('inputSuhu').value);
            const kelembapan = parseFloat(document.getElementById('inputKelembapan').value);
            const sekam = document.getElementById('inputSekam').value;
            const tirai = document.getElementById('inputTirai').value;
            const hujan = document.getElementById('inputHujan').value;
            const angin = document.getElementById('inputAngin').value;
            const waktuHujan = document.getElementById('inputWaktuHujan').value || '-';
            const nafsuMakan = document.getElementById('inputNafsuMakan').value;

            const card = document.getElementById('resultCard');
            const statusTitle = document.getElementById('statusTitle');
            const resRingkasan = document.getElementById('resRingkasan');
            const adviceText = document.getElementById('adviceText');

            if (isNaN(suhu) || isNaN(kelembapan)) {
                alert('Mohon isi angka suhu dan kelembapan dengan benar!');
                return;
            }

            card.style.display = 'block';
            resRingkasan.innerText = `Suhu: ${suhu}°C | Lembap: ${kelembapan}% | Sekam: ${sekam}`;

            let statusStr = '';
            let adviceStr = '';
            let statusClass = '';

            // Logika Analisis Kenyamanan Ayam Elba & KUB Janaka
            if (suhu >= 22 && suhu <= 26 && kelembapan >= 55 && kelembapan <= 70 && sekam === 'Kering & Gembur' && nafsuMakan === 'Normal Lahap') {
                statusClass = 'status-aman';
                statusStr = '✅ KONDISI IDEAL & AMAN';
                adviceStr = 'Lingkungan sangat nyaman untuk Elba & KUB Janaka. Pertumbuhan dan produktivitas telur optimal.';
            } else if (suhu > 30 || (suhu > 28 && kelembapan > 75) || nafsuMakan === 'Turun Drastis') {
                statusClass = 'status-bahaya';
                statusStr = '🚨 PERINGATAN: RISIKO STRES / GANGGUAN!';
                adviceStr = 'Terdeteksi potensi cekaman panas atau penurunan nafsu makan. Maksimalkan sirkulasi udara dan periksa air minum.';
            } else {
                statusClass = 'status-waspada';
                statusStr = '⚠️ KONDISI PERLU PERHATIAN';
                adviceStr = 'Ada parameter yang sedikit di luar batas ideal. Tetap pantau kondisi fisik ayam.';
            }

            // Tambahan analisis khusus kondisi sekam & cuaca
            if (sekam === 'Basah / Menggumpal') {
                adviceStr += ' Perhatian: Sekam basah memicu tingginya gas amonia yang berbahaya bagi pernapasan ayam. Segera ganti/balik sekam.';
            }
            if (hujan !== 'Tidak Hujan') {
                adviceStr += ` [Info Hujan: ${hujan}, Waktu: ${waktuHujan}]. Pastikan tirai sisi arah tampias hujan ditutup agar sekam tidak basah.`;
            }

            card.className = 'result-card ' + statusClass;
            statusTitle.innerText = statusStr;
            adviceText.innerText = adviceStr;

            simpanKeRiwayat(suhu, kelembapan, sekam, tirai, hujan, angin, waktuHujan, nafsuMakan, statusStr);
        }

        function simpanKeRiwayat(suhu, kelembapan, sekam, tirai, hujan, angin, waktuHujan, nafsuMakan, status) {
            const sekarang = new Date();
            const waktuCatat = sekarang.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) + ' ' + sekarang.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

            const dataBaru = { waktuCatat, suhu, kelembapan, sekam, tirai, hujan, angin, waktuHujan, nafsuMakan, status };

            let riwayat = JSON.parse(localStorage.getItem('riwayatSmartKandang')) || [];
            riwayat.unshift(dataBaru);
            if (riwayat.length > 50) riwayat.pop();

            localStorage.setItem('riwayatSmartKandang', JSON.stringify(riwayat));
            tampilkanRiwayat();
        }

        function tampilkanRiwayat() {
            const historyList = document.getElementById('historyList');
            const btnClear = document.getElementById('btnClear');
            let riwayat = JSON.parse(localStorage.getItem('riwayatSmartKandang')) || [];

            if (riwayat.length === 0) {
                historyList.innerHTML = '<p style="color: #64748b; font-style: italic;">Belum ada catatan tersimpan.</p>';
                btnClear.style.display = 'none';
                return;
            }

            btnClear.style.display = 'block';
            let html = '';
            riwayat.forEach(item => {
                html += `
                    <div class="history-item">
                        <div class="history-time">📅 ${item.waktuCatat}</div>
                        <strong>${item.suhu}°C | Lembap: ${item.kelembapan}% | Sekam: ${item.sekam}</strong>
                        <div style="color: #94a3b8; margin-top: 2px;">
                            🌧️ ${item.hujan} | 🪟 Tirai: ${item.tirai} | 🐔 Nafsu Makan: ${item.nafsuMakan}
                        </div>
                        <div style="margin-top: 3px; font-weight: bold; color: #38bdf8;">${item.status}</div>
                    </div>
                `;
            });
            historyList.innerHTML = html;
        }

        function hapusRiwayat() {
            if (confirm('Yakin ingin menghapus seluruh riwayat catatan kandang?')) {
                localStorage.removeItem('riwayatSmartKandang');
                tampilkanRiwayat();
            }
        }
    </script>
</body>
</html>
