<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisis Kandang Elba & KUB Janaka</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f4f7f6; color: #333; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: #fff; border-radius: 16px; padding: 25px; width: 100%; max-width: 420px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; margin-bottom: 5px; color: #2c3e50; font-size: 1.3rem; }
        .subtitle { text-align: center; font-size: 0.85rem; color: #666; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; }
        input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 1rem; }
        button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #27ae60; color: white; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; }
        button:hover { background: #219653; }
        .result-card { margin-top: 20px; padding: 15px; border-radius: 10px; background: #f8f9fa; border-left: 5px solid #ccc; }
        .status-aman { border-color: #27ae60; background: #e8f8f5; color: #1e8449; }
        .status-waspada { border-color: #f39c12; background: #fef9e7; color: #b7950b; }
        .status-bahaya { border-color: #c0392b; background: #f9ebea; color: #922b21; }
        .status-title { font-weight: bold; font-size: 1.1rem; margin-bottom: 5px; }
        .advice { font-size: 0.88rem; margin-top: 8px; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Analisis Kandang Ayam</h2>
        <div class="subtitle">Khusus: Ayam Elba & KUB 2 Janaka</div>
        
        <div class="input-group">
            <label>Suhu Kandang (°C):</label>
            <input type="number" id="inputSuhu" placeholder="Contoh: 26" step="0.1">
        </div>

        <div class="input-group">
            <label>Kelembapan Kandang (%):</label>
            <input type="number" id="inputKelembapan" placeholder="Contoh: 65" step="1">
        </div>

        <button onclick="analisisKandang()">Analisis Kondisi</button>

        <div class="result-card" id="resultCard" style="display: none;">
            <div class="status-title" id="statusTitle">--</div>
            <p>Suhu: <span id="resSuhu">--</span> | Kelembapan: <span id="resKelembapan">--</span></p>
            <div class="advice" id="adviceText">--</div>
        </div>
    </div>

    <script>
        function analisisKandang() {
            const suhu = parseFloat(document.getElementById('inputSuhu').value);
            const kelembapan = parseFloat(document.getElementById('inputKelembapan').value);
            const card = document.getElementById('resultCard');
            const statusTitle = document.getElementById('statusTitle');
            const resSuhu = document.getElementById('resSuhu');
            const resKelembapan = document.getElementById('resKelembapan');
            const adviceText = document.getElementById('adviceText');

            if (isNaN(suhu) || isNaN(kelembapan)) {
                alert('Masukkan angka suhu dan kelembapan dengan benar!');
                return;
            }

            card.style.display = 'block';
            resSuhu.innerText = suhu + '°C';
            resKelembapan.innerText = kelembapan + '%';

            // Logika Khusus Standar Kenyamanan Ayam Elba & KUB Janaka Dewasa:
            // Suhu Nyaman: 21°C - 26°C, Kelembapan Ideal: 60% - 70%
            if (suhu >= 22 && suhu <= 26 && kelembapan >= 55 && kelembapan <= 70) {
                card.className = 'result-card status-aman';
                statusTitle.innerText = '✅ KONDISI IDEAL & AMAN';
                adviceText.innerText = 'Suhu dan kelembapan sangat nyaman untuk Elba dan KUB Janaka. Produktivitas telur dan nafsu makan berada di titik optimal.';
            } 
            else if ((suhu > 26 && suhu <= 30) || (suhu >= 20 && suhu < 22)) {
                card.className = 'result-card status-waspada';
                statusTitle.innerText = '⚠️ WASPADA (Perubahan Mulai Terasa)';
                adviceText.innerText = 'Suhu/kelembapan sedikit bergeser dari zona nyaman. Pantau sirkulasi udara kandang agar ayam tidak mulai stres ringan.';
            } 
            else if (suhu > 30 || (suhu > 28 && kelembapan > 75)) {
                card.className = 'result-card status-bahaya';
                statusTitle.innerText = '🚨 BAHAYA: RISIKO HEAT STRESS!';
                adviceText.innerText = 'Suhu panas/lembab tinggi! Berisiko menurunkan produksi telur Elba/KUB, cangkang tipis, dan memicu kematian. Segera buka tirai lebar-lebar, maksimalkan kipas/blower, dan berikan air minum yang sejuk.';
            } 
            else if (suhu < 20) {
                card.className = 'result-card status-waspada';
                statusTitle.innerText = '❄️ SUHU TERLALU DINGIN';
                adviceText.innerText = 'Suhu terlalu rendah membuat ayam banyak membakar energi untuk menghangatkan badan, konsumsi pakan bisa meningkat drastis. Pertimbangkan merapatkan tirai sebagian.';
            } 
            else {
                card.className = 'result-card status-waspada';
                statusTitle.innerText = '⚠️ KELEMBAPAN TIDAK IDEAL';
                adviceText.innerText = 'Kelembapan di luar batas normal (bisa terlalu basah atau terlalu kering). Waspadai potensi amonia tinggi jika litter/sekam basah.';
            }
        }
    </script>
</body>
</html>
